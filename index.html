<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Calculadora</title>
</head>
<!--FONDO-->
<body style="background: linear-gradient(90deg,#000000, #4F4949);">
    <!--DIV TITULO-->
    <div style="align-items: center; display: flex; justify-content: center;">
        <h1 style="font-size: 50px; color:white; font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;">Calculator</h1>
    </div>
    <!--CUERPO PRINCIPAL-->
    <div style="margin-top: auto; display: flex; justify-content: center; text-align: center;">
        <div style="background: linear-gradient(120deg, #422057, #846994); border: 2px; border-radius: 6px; min-width: 500px; padding: 12px;">
            <!--RESULTADO-->
            <div style="border: 6px; background: goldenrod; border-radius: 6px; padding: 1px;">
                <h1 style="font-family: 'Roboto', sans-serif;">0</h1>
            </div>
            <!--BOTONES-->
            <div style="margin-top: 10px;">
                <button>9</button>
            </div>
        </div>
    </div>
</body>
</html>

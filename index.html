<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="script.js">
    <title>Calculadora</title>
</head>
<!--FONDO-->
<body style="background: linear-gradient(90deg,#000000, #4F4949);">
    <!--DIV TITULO-->
    <div style="align-items: center; display: flex; justify-content: center;">
        <h1 style="font-size: 50px; color:white; font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;">Calculadora</h1>
    </div>
    <!--CUERPO PRINCIPAL-->
    <div style="margin-top: auto; display: flex; justify-content: center; text-align: center;">
        <div style="background: linear-gradient(120deg, #422057, #846994); border: 2px; border-radius: 6px; min-width: 500px; padding: 12px;">
            <!--RESULTADO-->
            <div style="border: 6px; background: goldenrod; border-radius: 6px; padding: 1px;">
                <h1 style="font-family: 'Roboto', sans-serif;">0</h1>
            </div>
            <!--ESPACIADO-->
            <br>
            <!--BOTONES-->
            <div style="margin-top: 10px;">
                <div>
                    <!--PRIMERA FILA-->
                    <button style="background: linear-gradient(90deg, #877977, #B8ACAB); border-radius: 6px; 
                    min-height: 100px; min-width: 100px; font-family: 'Roboto', sans-serif; font-size: 20px;">C</button>
                    <button style="background: linear-gradient(90deg, #877977, #B8ACAB); border-radius: 6px; 
                    min-height: 100px; min-width: 100px; font-family: 'Roboto', sans-serif; font-size: 20px;">()</button>
                    <button style="background: linear-gradient(90deg, #877977, #B8ACAB); border-radius: 6px; 
                    min-height: 100px; min-width: 100px; font-family: 'Roboto', sans-serif; font-size: 20px;">%</button>
                    <button style="background: linear-gradient(90deg, #877977, #B8ACAB); border-radius: 6px; 
                    min-height: 100px; min-width: 100px; font-family: 'Roboto', sans-serif; font-size: 20px;">/</button>
                </div>
                <!--SEGUNDA FILA-->
                <div style="margin-top: 10px;">
                    <button style="background: linear-gradient(90deg, #877977, #B8ACAB); border-radius: 6px; 
                    min-height: 100px; min-width: 100px; font-family: 'Roboto', sans-serif; font-size: 20px;">9</button>
                    <button style="background: linear-gradient(90deg, #877977, #B8ACAB); border-radius: 6px; 
                    min-height: 100px; min-width: 100px; font-family: 'Roboto', sans-serif; font-size: 20px;">8</button>
                    <button style="background: linear-gradient(90deg, #877977, #B8ACAB); border-radius: 6px; 
                    min-height: 100px; min-width: 100px; font-family: 'Roboto', sans-serif; font-size: 20px;">7</button>
                    <button style="background: linear-gradient(90deg, #877977, #B8ACAB); border-radius: 6px; 
                    min-height: 100px; min-width: 100px; font-family: 'Roboto', sans-serif; font-size: 20px;">*</button>
                </div>
                <!--TERCERA FILA-->
                <div style="margin-top: 10px;">
                    <button style="background: linear-gradient(90deg, #877977, #B8ACAB); border-radius: 6px; 
                    min-height: 100px; min-width: 100px; font-family: 'Roboto', sans-serif; font-size: 20px;">6</button>
                    <button style="background: linear-gradient(90deg, #877977, #B8ACAB); border-radius: 6px; 
                    min-height: 100px; min-width: 100px; font-family: 'Roboto', sans-serif; font-size: 20px;">5</button>
                    <button style="background: linear-gradient(90deg, #877977, #B8ACAB); border-radius: 6px; 
                    min-height: 100px; min-width: 100px; font-family: 'Roboto', sans-serif; font-size: 20px;">4</button>
                    <button style="background: linear-gradient(90deg, #877977, #B8ACAB); border-radius: 6px; 
                    min-height: 100px; min-width: 100px; font-family: 'Roboto', sans-serif; font-size: 20px;">+</button>
                </div>
                <!--CUARTA FILA-->
                <div style="margin-top: 10px;">
                    <button style="background: linear-gradient(90deg, #877977, #B8ACAB); border-radius: 6px; 
                    min-height: 100px; min-width: 100px; font-family: 'Roboto', sans-serif; font-size: 20px;">3</button>
                    <button style="background: linear-gradient(90deg, #877977, #B8ACAB); border-radius: 6px; 
                    min-height: 100px; min-width: 100px; font-family: 'Roboto', sans-serif; font-size: 20px;">2</button>
                    <button style="background: linear-gradient(90deg, #877977, #B8ACAB); border-radius: 6px; 
                    min-height: 100px; min-width: 100px; font-family: 'Roboto', sans-serif; font-size: 20px;">1</button>
                    <button style="background: linear-gradient(90deg, #877977, #B8ACAB); border-radius: 6px; 
                    min-height: 100px; min-width: 100px; font-family: 'Roboto', sans-serif; font-size: 20px;">-</button>
                </div>
                <!--QUINTA FILA-->
                <div style="margin-top: 10px;">
                    <button style="background: linear-gradient(90deg, #877977, #B8ACAB); border-radius: 6px; 
                    min-height: 100px; min-width: 200px; font-family: 'Roboto', sans-serif; font-size: 20px;">0</button>
                    <button style="background: linear-gradient(90deg, #877977, #B8ACAB); border-radius: 6px; 
                    min-height: 100px; min-width: 100px; font-family: 'Roboto', sans-serif; font-size: 20px;">.</button>
                    <button style="background: linear-gradient(90deg, #877977, #B8ACAB); border-radius: 6px; 
                    min-height: 100px; min-width: 100px; font-family: 'Roboto', sans-serif; font-size: 20px;">=</button>
                </div>
            </div>
            <!--ESPACIADO-->
            <br>
        </div>
    </div>
</body>
</html>

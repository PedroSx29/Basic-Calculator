<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Calculadora</title>
</head>
<!--FONDO-->
<body style="background: linear-gradient(90deg,#000000, #4F4949);">
    <!--DIV TITULO-->
    <div style="align-items: center; display: flex; justify-content: center;">
        <h1 style="font-size: 50px; color:white; font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;">Calculadora</h1>
    </div>
    <!--CUERPO PRINCIPAL-->
    <div style="margin-top: auto; display: flex; justify-content: center; text-align: center;">
        <div style="background: linear-gradient(120deg, #422057, #846994); border: 2px; border-radius: 50px; min-width: 500px; padding: 12px;">
            <!--RESULTADO-->
            <div>
                <div>
                    <input type="text" style="font-family: 'Roboto', sans-serif; border: 6px; background: rgb(100, 96, 87); 
                    border-radius: 30px; padding: 10px; min-width: 340px; text-align: start; font-size: 20px;
                    width: 390px; height: 20px;" value="0" id="proceso" readonly>
                </div>
                <br>
                <input type="text" style="font-family: 'Roboto', sans-serif; border: 6px; background: goldenrod; 
                border-radius: 30px; padding: 30px; min-width: 340px; text-align: end; font-size: 30px;" 
                id="result" name="result" value="0" readonly>
            </div>
            <!--ESPACIADO-->
            <br>
            <!--BOTONES-->
            <div style="margin-top: 10px;">
                <div>
                    <!--PRIMERA FILA-->
                    <button style="background: rgb(100, 96, 87); border-radius: 60px; 
                    min-height: 100px; min-width: 100px; font-family: 'Roboto', sans-serif; font-size: 20px;"
                    name="btnC" id="btnC" onclick="limpiar()">C</button>
                    <button style="background: goldenrod; border-radius: 60px; 
                    min-height: 100px; min-width: 100px; font-family: 'Roboto', sans-serif; font-size: 20px;"
                    name="btnPar" id="btnPar" onclick="actualizarParentesis()">()</button>
                    <button style="background: rgb(100, 96, 87); border-radius: 60px; 
                    min-height: 100px; min-width: 100px; font-family: 'Roboto', sans-serif; font-size: 20px;"
                    name="btn%" id="btn%" onclick="actualizarOperador('%')">%</button>
                    <button style="background: goldenrod; border-radius: 60px; 
                    min-height: 100px; min-width: 100px; font-family: 'Roboto', sans-serif; font-size: 20px;"
                    name="btnDiv" id="btnDiv" onclick="actualizarOperador('/')">/</button>
                </div>
                <!--SEGUNDA FILA-->
                <div style="margin-top: 10px;">
                    <button style="background: rgb(100, 96, 87); border-radius: 60px; 
                    min-height: 100px; min-width: 100px; font-family: 'Roboto', sans-serif; font-size: 20px;"
                    onclick="actualizarNumeros('7')">7</button>
                    <button style="background: goldenrod; border-radius: 60px; 
                    min-height: 100px; min-width: 100px; font-family: 'Roboto', sans-serif; font-size: 20px;"
                    onclick="actualizarNumeros('8')">8</button>
                    <button style="background: rgb(100, 96, 87); border-radius: 60px; 
                    min-height: 100px; min-width: 100px; font-family: 'Roboto', sans-serif; font-size: 20px;"
                    onclick="actualizarNumeros('9')">9</button>
                    <button style="background: goldenrod; border-radius: 60px; 
                    min-height: 100px; min-width: 100px; font-family: 'Roboto', sans-serif; font-size: 20px;"
                    onclick="actualizarOperador('*')">*</button>
                </div>
                <!--TERCERA FILA-->
                <div style="margin-top: 10px;">
                    <button style="background: rgb(100, 96, 87); border-radius: 60px; 
                    min-height: 100px; min-width: 100px; font-family: 'Roboto', sans-serif; font-size: 20px;"
                    onclick="actualizarNumeros('4')">4</button>
                    <button style="background: goldenrod; border-radius: 60px; 
                    min-height: 100px; min-width: 100px; font-family: 'Roboto', sans-serif; font-size: 20px;"
                    onclick="actualizarNumeros('5')">5</button>
                    <button style="background: rgb(100, 96, 87); border-radius: 60px; 
                    min-height: 100px; min-width: 100px; font-family: 'Roboto', sans-serif; font-size: 20px;"
                    onclick="actualizarNumeros('6')">6</button>
                    <button style="background: goldenrod; border-radius: 60px; 
                    min-height: 100px; min-width: 100px; font-family: 'Roboto', sans-serif; font-size: 20px;"
                    onclick="actualizarOperador('+')">+</button>
                </div>
                <!--CUARTA FILA-->
                <div style="margin-top: 10px;">
                    <button style="background: rgb(100, 96, 87); border-radius: 60px; 
                    min-height: 100px; min-width: 100px; font-family: 'Roboto', sans-serif; font-size: 20px;"
                    onclick="actualizarNumeros('1')">1</button>
                    <button style="background: goldenrod; border-radius: 60px; 
                    min-height: 100px; min-width: 100px; font-family: 'Roboto', sans-serif; font-size: 20px;"
                    onclick="actualizarNumeros('2')">2</button>
                    <button style="background: rgb(100, 96, 87); border-radius: 60px; 
                    min-height: 100px; min-width: 100px; font-family: 'Roboto', sans-serif; font-size: 20px;"
                    onclick="actualizarNumeros('3')">3</button>
                    <button style="background: goldenrod; border-radius: 60px; 
                    min-height: 100px; min-width: 100px; font-family: 'Roboto', sans-serif; font-size: 20px;"
                    onclick="actualizarOperador('-')">-</button>
                </div>
                <!--QUINTA FILA-->
                <div style="margin-top: 10px;">
                    <button style="background: goldenrod; border-radius: 60px; 
                    min-height: 100px; min-width: 200px; font-family: 'Roboto', sans-serif; font-size: 20px;"
                    onclick="actualizarNumeros('0')">0</button>
                    <button style="background: rgb(100, 96, 87); border-radius: 60px; 
                    min-height: 100px; min-width: 100px; font-family: 'Roboto', sans-serif; font-size: 20px;"
                    onclick="actualizarNumeros('.')">.</button>
                    <button style="background: goldenrod; border-radius: 60px; 
                    min-height: 100px; min-width: 100px; font-family: 'Roboto', sans-serif; font-size: 20px;"
                    onclick="calcular()">=</button>
                </div>
            </div>
            <!--ESPACIADO-->
            <br>
        </div>
    </div>
    <br>
    <script src="script.js"></script>
</body>
</html>
